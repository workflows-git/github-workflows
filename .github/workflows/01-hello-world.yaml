```yaml
name: Hello World Workflow

# Triggers
on:
  push:
  workflow_dispatch:

# A workflow run is made up of one or more jobs
jobs:
  say-hello:
    # Self-hosted runner configuration
    runs-on:
      group: Chisty
      labels: [self-hosted, Chisty, nodejs]

    # Steps represent a sequence of tasks
    steps:
      # Step 1: Print a greeting
      - name: Run Hello World
        run: echo "Hello, World GitHub Actions! We are rerunning the workflow"

      # Step 2: Display hostname
      - name: Show Hostname
        run: hostname

      # Step 3: List files and directories
      - name: List Files
        run: ls -la

      # Step 4: Display current directory
      - name: Show Current Directory
        run: pwd

      # Step 5: Display the runner user
      - name: Show Current User
        run: whoami
```
