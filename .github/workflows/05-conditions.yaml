name: conditions Workflow

# triggers
on:
  push:
       
# A workflow run is made up of one or more jobs
jobs:
  conditions:
    # The type of runner that the job will run on (similar to jenkins agent)
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Prints a greeting to the runner console
      - name: on main branch
        if: github.ref_name == 'main'
        run: |
          echo "We are in Main branch"

      - name: on other branch
        if: github.ref_name != 'main'
        run: |
          echo "We are in other branch"

      