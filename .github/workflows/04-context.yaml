name: context

# triggers
on:
  push:
env:
  project: roboshop
  environment: dev
       
# A workflow run is made up of one or more jobs
jobs:
  first-job:
    # The type of runner that the job will run on (similar to jenkins agent)
    runs-on: ubuntu-latest
    outputs:
      version_id: ${{ steps.version.outputs.VERSION }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Prints a greeting to the runner console
      - name: Run Hello World
        run: echo "Hello, World GitHub Actions!"

      - name: Print environment variables
        run: |
          echo "Project: ${{ env.project }}"
          echo "Environment: ${{ env.environment }}"

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: adding new variables
        run: |
          echo "devops_sir=Siva" >> $GITHUB_ENV  
          echo "linux_sir=Srikanth" >> $GITHUB_ENV 


      - name: accessing previous step variables
        run: |
          echo "Devops sir: $devops_sir"
          echo "Linux sir: $linux_sir"

      - name: exporting outputs to other job
        id: version # An ID is required to reference this step's outputs
        run: |
          # Create your value dynamically
          echo "VERSION=4.0.0" >> "$GITHUB_OUTPUT"

  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: accessing outputs from first job
        run: |
          echo "Version: ${{ needs.first-job.outputs.version_id }}"